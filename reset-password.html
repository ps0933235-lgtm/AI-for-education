<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ff">
  <meta name="referrer" content="no-referrer">
  <title>Choose a new password — Learnova AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="auth.js" defer></script>
</head>
<body class="auth-page" data-auth-page="reset">
  <main class="auth-layout">
    <a class="brand auth-brand" href="index.html"><span class="brand-mark" aria-hidden="true">✦</span><span>learnova<span class="brand-ai">.ai</span></span></a>
    <section class="auth-card">
      <div class="auth-illustration" aria-hidden="true">✨</div>
      <p class="eyebrow">ONE SMALL STEP</p>
      <h1>Choose a new password.</h1>
      <p class="auth-intro">Make it at least 12 characters. Your old sessions will be signed out.</p>
      <form class="auth-form" id="resetForm" novalidate>
        <label for="newPassword">New password</label>
        <div class="password-field"><input id="newPassword" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="200" placeholder="At least 12 characters"><button class="password-toggle" type="button" data-password-toggle="newPassword" aria-label="Show password" aria-pressed="false">Show</button></div>
        <label for="newPasswordConfirm">Confirm new password</label>
        <div class="password-field"><input id="newPasswordConfirm" name="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="200" placeholder="Type it one more time"><button class="password-toggle" type="button" data-password-toggle="newPasswordConfirm" aria-label="Show password" aria-pressed="false">Show</button></div>
        <p class="auth-message" id="authMessage" role="alert" hidden></p>
        <button class="button button-primary auth-submit" id="resetButton" type="submit">Save new password <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch"><a href="login.html">Back to log in</a></p>
    </section>
    <p class="auth-footnote">Reset links expire after 30 minutes and can only be used once.</p>
  </main>
</body>
</html>
